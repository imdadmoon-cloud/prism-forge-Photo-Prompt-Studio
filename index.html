<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d1b">
<meta name="description" content="PrismForge is a colorful 3D AI Photo Prompt Studio to save, organize and manage creative prompts.">
<title>PrismForge | AI Photo Prompt Studio</title>
<style>
:root{color-scheme:dark;--ink:#f4f5ff;--muted:#a5afd0;--line:#a5b4fc33;--violet:#8b5cf6;--cyan:#22d3ee}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:15px Inter,"Segoe UI",system-ui,sans-serif;background:radial-gradient(ellipse at 10% 0%,#31205b 0,transparent 36%),radial-gradient(ellipse at 95% 12%,#063b4b 0,transparent 30%),linear-gradient(135deg,#090d1b,#17102b);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(#b9c5ff 1px,transparent 1px);background-size:28px 28px}
.app{position:relative;display:grid;grid-template-columns:270px 1fr;gap:28px;padding:26px;max-width:1600px;margin:auto;perspective:1400px}
aside{position:sticky;top:24px;align-self:start;background:linear-gradient(155deg,#252b4ee8,#0e1226ed);border:1px solid #a493ff3d;border-radius:24px;padding:20px 16px;box-shadow:0 24px 60px #0008,inset 0 1px #ffffff1a;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}.logo{width:54px;height:54px;filter:drop-shadow(0 0 14px #8b5cf688);animation:float 4s ease-in-out infinite}.brand h1{font-size:22px;margin:0;background:linear-gradient(90deg,#fff,#b6a4ff,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{margin:0 0 18px 66px;font-size:11px;letter-spacing:.6px;color:#c4b5fd}
@keyframes float{50%{transform:translateY(-4px) rotate(3deg)}}
.cat{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 9px;padding:11px 13px;border:1px solid #a493ff20;border-radius:12px;color:var(--ink);cursor:pointer;background:#ffffff0b;font:inherit;text-align:left;transition:.2s}.cat:hover{transform:translateX(4px);background:#8b5cf629}.cat.on{background:linear-gradient(110deg,#7c3aed,#2563eb 70%,#0891b2);box-shadow:0 8px 22px #4c1d9580}.n{font-size:12px;opacity:.8}.delcat{margin-left:8px;opacity:.6}
.addcat{display:flex;gap:7px;margin-top:14px}
input,textarea,select{width:100%;padding:10px 11px;color:var(--ink);background:#070b1bb3;border:1px solid #94a3ff38;border-radius:11px;font:inherit}input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn{border:0;border-radius:11px;padding:10px 15px;color:white;background:linear-gradient(115deg,#8b5cf6,#4f46e5 65%,#0891b2);font:inherit;font-weight:750;cursor:pointer;box-shadow:0 7px 18px #4c1d9545;transition:.15s;white-space:nowrap}.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}.btn.ghost{background:#ffffff0e;border:1px solid #94a3ff38;box-shadow:none;color:var(--ink)}.side-actions{display:flex;margin-top:16px}.side-actions .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}.tile{position:relative;overflow:hidden;background:linear-gradient(145deg,#22284be8,#0f142bed);border:1px solid #94a3ff30;border-radius:18px;padding:17px 18px;box-shadow:0 15px 35px #0007;border-bottom:3px solid var(--violet)}.tile:nth-child(2){border-bottom-color:var(--cyan)}.tile:nth-child(3){border-bottom-color:#f472b6}.tile b{display:block;font-size:30px}.tile span{font-size:12px;color:var(--muted)}
.top{display:flex;gap:10px;margin-bottom:25px;align-items:center}.top input{max-width:430px}.sp{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:26px 22px}.scene{perspective:1000px}
.card{--rx:0deg;--ry:0deg;position:relative;display:flex;flex-direction:column;gap:9px;padding:12px 12px 14px;color:var(--ink);background:linear-gradient(150deg,#222848fa,#0f142afa);border:1px solid #94a3ff33;border-radius:17px;box-shadow:0 15px 30px #0008,inset 0 1px #ffffff0d;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .18s,box-shadow .18s;overflow:hidden}.card:hover{box-shadow:0 28px 45px #0009,0 0 0 1px #8b5cf655}.card img,.noimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:linear-gradient(135deg,#312e81,#0e7490);transform:translateZ(14px)}.noimg{display:grid;place-items:center;color:#c4b5fd;font-size:13px}.card h3{margin:3px 0 0;font-size:17px;transform:translateZ(22px)}.tag{font-size:11px;color:#a5b4fc;text-transform:uppercase;letter-spacing:1px}.ptxt{font-size:13px;line-height:1.5;white-space:pre-wrap;max-height:90px;overflow:auto;color:#cbd5e1}.row{display:flex;gap:7px;margin-top:5px;transform:translateZ(24px)}.row .btn{padding:8px 9px;font-size:12px}.row .btn:first-child{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:70px 10px;color:var(--muted);border:1px dashed #64748b77;border-radius:20px;background:#ffffff05}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:#020512c9;backdrop-filter:blur(8px)}.modal.show{display:flex}.box{width:100%;max-width:520px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:11px;padding:22px;background:linear-gradient(150deg,#20264a,#10152d);border:1px solid #a5b4fc44;border-radius:20px;box-shadow:0 30px 80px #0009}.box h2{margin:0;font-size:20px}label{display:block;margin-bottom:5px;color:var(--muted);font-size:13px}.hint{margin:0;color:var(--muted);font-size:12.5px}.prev{display:none;width:100%;max-height:170px;object-fit:cover;border-radius:9px}.actions{display:flex;gap:8px;justify-content:flex-end}.toast{position:fixed;z-index:30;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 17px;border-radius:30px;background:#e0e7ff;color:#171533;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:760px){.app{grid-template-columns:1fr;gap:17px;padding:14px}aside{position:static}#cats{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 12px}.cat{width:auto;white-space:nowrap}.cat.on{transform:translateY(-2px)}.tile{padding:13px}.tile b{font-size:24px}.top{flex-wrap:wrap}.top input{max-width:none;flex:1 1 100%}.grid{gap:18px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand">
<svg class="logo" viewBox="0 0 64 64" role="img" aria-label="PrismForge prism logo"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset=".52" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><path d="M32 4 57 18v28L32 60 7 46V18Z" fill="none" stroke="url(#g)" stroke-width="2.5"/><path d="M32 11 49 42H15Z" fill="url(#g)"/><path d="M32 11v39M15 42h34M7 18l25 32 25-32" fill="none" stroke="#eef2ff" stroke-opacity=".75" stroke-width="1.4"/><circle cx="48" cy="13" r="3" fill="#f9a8d4"/></svg>
<div><h1>PrismForge</h1><div style="font-size:10px;letter-spacing:1.5px;color:#a5b4fc">PHOTO PROMPT STUDIO</div></div>
</div>
<p class="sub">✦ Imagine It. Prompt It. Create It.</p>
<div id="cats"></div>
<div class="addcat"><input id="newcat" placeholder="New category" maxlength="30"><button class="btn" id="addcatBtn">Add</button></div>
<div class="side-actions"><button class="btn ghost" id="openBackup">Backup & Restore</button></div>
</aside>
<main><div class="stats" id="stats"></div><div class="top"><input id="q" placeholder="⌕  Search your prompt library…"><span class="sp"></span><button class="btn" id="openAdd">＋ Add prompt</button></div><div class="grid" id="grid"></div></main>
</div>
<div class="modal" id="modal"><div class="box"><h2 id="mt">Add prompt</h2><div><label>Photo reference</label><input type="file" id="file" accept="image/*"><img class="prev" id="prev" alt="Photo preview"></div><div><label>Title (optional)</label><input id="title" maxlength="60" placeholder="Give your prompt a name"></div><div><label>Category</label><select id="catsel"></select></div><div><label>Prompt</label><textarea id="ptext" rows="6" placeholder="Write or paste your AI photo prompt…"></textarea></div><div class="actions"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save prompt</button></div></div></div>
<div class="modal" id="bmodal"><div class="box"><h2>Backup & Restore</h2><p class="hint">Export your prompts, photos and categories as a JSON backup. Keep it somewhere safe.</p><button class="btn" id="exp">Download backup</button><hr style="width:100%;border:0;border-top:1px solid #ffffff22"><p class="hint">Import a previous PrismForge backup. Existing prompts will be kept.</p><input type="file" id="impfile" accept=".json,application/json"><textarea id="imptext" rows="4" placeholder="Or paste backup JSON here"></textarea><div class="actions"><button class="btn ghost" id="bclose">Close</button><button class="btn" id="imp">Import backup</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY="prismForge.photoPrompts.v1";let state={cats:["Portraits","Wedding","Studio","Landscapes"],items:[]},active="All",editId=null,imgData="";
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed?.cats&&parsed?.items)state=parsed}}catch(e){}
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast("Browser storage full. Export a backup and remove large photos.");return false}}
function renderCats(){let h='<button class="cat'+(active==="All"?" on":"")+'" data-c="All"><span>✦ All prompts</span><span class="n">'+state.items.length+'</span></button>';state.cats.forEach(c=>{const n=state.items.filter(i=>i.cat===c).length;h+='<button class="cat'+(active===c?" on":"")+'" data-c="'+esc(c)+'"><span>'+esc(c)+'</span><span><span class="n">'+n+'</span><span class="delcat" data-del="'+esc(c)+'" title="Delete category">×</span></span></button>'});$("cats").innerHTML=h}
function render(){renderCats();$("stats").innerHTML='<div class="tile"><b>'+state.items.length+'</b><span>Saved prompts</span></div><div class="tile"><b>'+state.cats.length+'</b><span>Categories</span></div><div class="tile"><b>'+state.items.filter(i=>i.img).length+'</b><span>With photos</span></div>';renderGrid()}
function renderGrid(){const q=$("q").value.toLowerCase();const list=state.items.filter(i=>(active==="All"||i.cat===active)&&(!q||(i.title+" "+i.text+" "+i.cat).toLowerCase().includes(q)));if(!list.length){$("grid").innerHTML='<div class="empty">No prompts here yet. Select <b>Add prompt</b> to build your creative library.</div>';return}$("grid").innerHTML=list.map(i=>'<div class="scene"><div class="card">'+(i.img?'<img src="'+i.img+'" alt="Prompt reference">':'<div class="noimg">✦ No photo reference</div>')+'<h3>'+esc(i.title||"Untitled prompt")+'</h3><div class="tag">'+esc(i.cat)+'</div><div class="ptxt">'+esc(i.text)+'</div><div class="row"><button class="btn" data-copy="'+i.id+'">Copy prompt</button><button class="btn ghost" data-edit="'+i.id+'">Edit</button><button class="btn ghost" data-rm="'+i.id+'">Delete</button></div></div></div>').join("")}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;$("grid").addEventListener("pointermove",e=>{if(reduce||e.pointerType==="touch")return;const c=e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.setProperty("--ry",x*14+"deg");c.style.setProperty("--rx",-y*14+"deg")});$("grid").addEventListener("pointerout",e=>{const c=e.target.closest(".card");if(c&&!c.contains(e.relatedTarget)){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}});
function fillSel(sel){$("catsel").innerHTML=state.cats.map(c=>'<option value="'+esc(c)+'"'+(c===sel?" selected":"")+'>'+esc(c)+'</option>').join("")}
function openModal(item){if(!state.cats.length){toast("Add a category first");return}editId=item?item.id:null;imgData=item?.img||"";$("mt").textContent=item?"Edit prompt":"Add a new prompt";$("title").value=item?.title||"";$("ptext").value=item?.text||"";$("file").value="";fillSel(item?.cat||(active!=="All"?active:state.cats[0]));const pv=$("prev");if(imgData){pv.src=imgData;pv.style.display="block"}else pv.style.display="none";$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}
$("file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);imgData=c.toDataURL("image/jpeg",.78);$("prev").src=imgData;$("prev").style.display="block"};im.src=r.result};r.readAsDataURL(f)});
$("save").onclick=()=>{const text=$("ptext").value.trim();if(!text){toast("Please write the prompt first");return}const d={title:$("title").value.trim(),cat:$("catsel").value,text,img:imgData};if(editId)state.items=state.items.map(i=>i.id===editId?{...i,...d}:i);else state.items.unshift({id:"p"+Date.now(),...d});if(persist()){closeModal();render();toast("Prompt saved successfully")}};
$("cancel").onclick=closeModal;$("openAdd").onclick=()=>openModal(null);$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});$("q").addEventListener("input",renderGrid);
function addCat(){const v=$("newcat").value.trim();if(!v)return;if(state.cats.some(c=>c.toLowerCase()===v.toLowerCase())){toast("Category already exists");return}state.cats.push(v);$("newcat").value="";active=v;persist();render()}$("addcatBtn").onclick=addCat;$("newcat").addEventListener("keydown",e=>{if(e.key==="Enter")addCat()});
$("cats").addEventListener("click",e=>{const d=e.target.getAttribute("data-del");if(d){e.stopPropagation();if(confirm('Delete category "'+d+'" and all its prompts?')){state.cats=state.cats.filter(c=>c!==d);state.items=state.items.filter(i=>i.cat!==d);if(active===d)active="All";persist();render()}return}const b=e.target.closest(".cat");if(b){active=b.getAttribute("data-c");render()}});
function copyText(t){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast("Prompt copied")).catch(()=>fallbackCopy(t));else fallbackCopy(t)}function fallbackCopy(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();toast("Prompt copied")}
$("grid").addEventListener("click",e=>{const t=e.target;let id=t.getAttribute("data-copy");if(id){copyText(state.items.find(i=>i.id===id).text);return}id=t.getAttribute("data-edit");if(id){openModal(state.items.find(i=>i.id===id));return}id=t.getAttribute("data-rm");if(id&&confirm("Delete this prompt?")){state.items=state.items.filter(i=>i.id!==id);persist();render();toast("Prompt deleted")}});
$("openBackup").onclick=()=>$("bmodal").classList.add("show");$("bclose").onclick=()=>$("bmodal").classList.remove("show");$("bmodal").addEventListener("click",e=>{if(e.target===$("bmodal"))$("bmodal").classList.remove("show")});
$("exp").onclick=()=>{const blob=new Blob([JSON.stringify({app:"PrismForge",v:1,cats:state.cats,items:state.items},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="prismforge-backup.json";a.click();URL.revokeObjectURL(url);toast("Backup downloaded")};
$("impfile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$("imptext").value=r.result;r.readAsText(f)});
$("imp").onclick=()=>{let data;try{data=JSON.parse($("imptext").value.trim())}catch(e){toast("Backup JSON is not valid");return}if(!data||!Array.isArray(data.cats)||!Array.isArray(data.items)){toast("Backup file format is not valid");return}data.cats.forEach(c=>{if(!state.cats.includes(c))state.cats.push(c)});const have=new Set(state.items.map(i=>i.id));let added=0;data.items.forEach(i=>{if(i?.id&&i.text&&!have.has(i.id)){if(!state.cats.includes(i.cat))state.cats.push(i.cat);state.items.push(i);added++}});if(persist()){render();$("imptext").value="";$("impfile").value="";$("bmodal").classList.remove("show");toast(added+" prompts imported")}};
render();
</script>
</body>
</html>
